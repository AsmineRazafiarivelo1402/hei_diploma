openapi: 3.0.3
info:
  title: HEI Diploma API
  description: Comprehensive API for HEI Diploma management, including users, courses, groups, exams, grades, and student assignments.
  version: "1.0.0"
  contact:
    name: HEI Diploma Support
    email: support@hei-diploma.com

servers:
  - url: https://jw2gvvbvscbctuisnk4khuphxq0bxvqz.lambda-url.eu-west-3.on.aws/
    description: Pre-production server
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Users
    description: User management (creation and administration)
  - name: Students
    description: Student operations
  - name: Teachers
    description: Teacher operations
  - name: Courses
    description: Course management
  - name: Promotions
    description: Promotion (academic year) management
  - name: Semesters
    description: Semester management
  - name: Groups
    description: Student group management
  - name: Exams
    description: Examination management
  - name: Notes
    description: Grade management
  - name: Note Histories
    description: Grade modification history
  - name: Teachings
    description: Course-teacher associations
  - name: Course Specialities
    description: Course specialities
  - name: Affectations
    description: Student-to-group assignments
  - name: Group Exams
    description: Group-to-exam associations

paths:
  /users:
    post:
      tags: [Users]
      summary: Create an administrator
      description: Creates a new administrator user.
      operationId: createAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminRequest'
      responses:
        '201':
          description: Administrator successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/students:
    post:
      tags: [Users]
      summary: Create a student (legacy endpoint)
      operationId: createStudentLegacy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Student successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/teachers:
    post:
      tags: [Users]
      summary: Create a teacher (legacy endpoint)
      operationId: createTeacherLegacy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Teacher successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admins:
    post:
      tags: [Users]
      summary: Create an administrator (legacy endpoint)
      operationId: createAdminLegacy
      security:
        - bearerAuth: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Administrator successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Not authenticated
        '403':
          description: Access denied (insufficient role)
        '409':
          $ref: '#/components/responses/Conflict'

  /students:
    post:
      tags: [Students]
      summary: Create a student
      operationId: createStudent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Student'
      responses:
        '201':
          description: Student successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [Students]
      summary: Retrieve all students
      operationId: getAllStudents
      responses:
        '200':
          description: List of all students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Student'

  /students/{id}:
    get:
      tags: [Students]
      summary: Retrieve a student by ID
      operationId: getStudentById
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Student details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '404':
          description: Student not found
    put:
      tags: [Students]
      summary: Update a student
      operationId: updateStudent
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Student'
      responses:
        '200':
          description: Student successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Student not found
    delete:
      tags: [Students]
      summary: Delete a student
      operationId: deleteStudent
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '204':
          description: Student successfully deleted
        '404':
          description: Student not found

