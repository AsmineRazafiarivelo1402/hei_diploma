openapi: 3.0.3
info:
  title: HEI Diploma API
  description: API complète pour la gestion du diplôme HEI, incluant les utilisateurs, cours, groupes, examens, notes et affectations.
  version: "1.0.0"
  contact:
    name: Support HEI Diploma
    email: support@hei-diploma.com

servers:
  - url: https://api.hei-diploma.example.com
    description: Serveur de production
  - url: http://localhost:8080
    description: Serveur de développement local

tags:
  - name: Users
    description: Gestion des utilisateurs (création)
  - name: Students
    description: Opérations sur les étudiants
  - name: Teachers
    description: Opérations sur les enseignants
  - name: Courses
    description: Gestion des cours
  - name: Promotions
    description: Gestion des promotions
  - name: Semesters
    description: Gestion des semestres
  - name: Groups
    description: Gestion des groupes
  - name: Exams
    description: Gestion des examens
  - name: Notes
    description: Gestion des notes
  - name: Note Histories
    description: Historique des modifications des notes
  - name: Teachings
    description: Association entre cours et enseignants
  - name: Course Specialities
    description: Spécialités associées aux cours
  - name: Affectations
    description: Affectation des étudiants aux groupes
  - name: Group Exams
    description: Association entre groupes et examens

paths:
  /users:
    post:
      tags: [Users]
      summary: Créer un administrateur
      description: Crée un nouvel administrateur.
      operationId: createAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminRequest'
      responses:
        '201':
          description: Administrateur créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/students:
    post:
      tags: [Users]
      summary: Créer un étudiant
      operationId: createStudentLegacy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Étudiant créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/teachers:
    post:
      tags: [Users]
      summary: Créer un enseignant
      operationId: createTeacherLegacy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Enseignant créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admins:
    post:
      tags: [Users]
      summary: Créer un administrateur
      operationId: createAdminLegacy
      security:
        - bearerAuth: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Administrateur créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Non authentifié
        '403':
          description: Accès refusé (rôle insuffisant)
        '409':
          $ref: '#/components/responses/Conflict'

  /students:
    post:
      tags: [Students]
      summary: Créer un étudiant
      operationId: createStudent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Student'
      responses:
        '201':
          description: Étudiant créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [Students]
      summary: Récupérer tous les étudiants
      operationId: getAllStudents
      responses:
        '200':
          description: Liste de tous les étudiants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Student'

  /students/{id}:
    get:
      tags: [Students]
      summary: Récupérer un étudiant par son ID
      operationId: getStudentById
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Détails de l'étudiant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '404':
          description: Étudiant non trouvé
    put:
      tags: [Students]
      summary: Mettre à jour un étudiant
      operationId: updateStudent
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Student'
      responses:
        '200':
          description: Étudiant mis à jour avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Étudiant non trouvé
    delete:
      tags: [Students]
      summary: Supprimer un étudiant
      operationId: deleteStudent
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '204':
          description: Étudiant supprimé avec succès
        '404':
          description: Étudiant non trouvé

  /teachers:
    post:
      tags: [Teachers]
      summary: Créer un enseignant
      operationId: createTeacher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Teacher'
      responses:
        '201':
          description: Enseignant créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teacher'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [Teachers]
      summary: Récupérer tous les enseignants
      operationId: getAllTeachers
      responses:
        '200':
          description: Liste de tous les enseignants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Teacher'

  /teachers/{id}:
    get:
      tags: [Teachers]
      summary: Récupérer un enseignant par son ID
      operationId: getTeacherById
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Détails de l'enseignant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teacher'
        '404':
          description: Enseignant non trouvé
    put:
      tags: [Teachers]
      summary: Mettre à jour un enseignant
      operationId: updateTeacher
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Teacher'
      responses:
        '200':
          description: Enseignant mis à jour avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teacher'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Enseignant non trouvé
    delete:
      tags: [Teachers]
      summary: Supprimer un enseignant
      operationId: deleteTeacher
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '204':
          description: Enseignant supprimé avec succès
        '404':
          description: Enseignant non trouvé

  /courses:
    post:
      tags: [Courses]
      summary: Créer un cours
      operationId: createCourse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Course'
      responses:
        '201':
          description: Cours créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [Courses]
      summary: Récupérer tous les cours
      operationId: getAllCourses
      responses:
        '200':
          description: Liste de tous les cours
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'

  /courses/{id}:
    get:
      tags: [Courses]
      summary: Récupérer un cours par son ID
      operationId: getCourseById
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Détails du cours
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '404':
          description: Cours non trouvé
    put:
      tags: [Courses]
      summary: Mettre à jour un cours
      operationId: updateCourse
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Course'
      responses:
        '200':
          description: Cours mis à jour avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Cours non trouvé
    delete:
      tags: [Courses]
      summary: Supprimer un cours
      operationId: deleteCourse
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '204':
          description: Cours supprimé avec succès
        '404':
          description: Cours non trouvé

  /promotions:
    post:
      tags: [Promotions]
      summary: Créer une promotion
      operationId: createPromotion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Promotion'
      responses:
        '201':
          description: Promotion créée avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promotion'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [Promotions]
      summary: Récupérer toutes les promotions
      operationId: getAllPromotions
      responses:
        '200':
          description: Liste de toutes les promotions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Promotion'

  /promotions/{id}:
    get:
      tags: [Promotions]
      summary: Récupérer une promotion par son ID
      operationId: getPromotionById
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Détails de la promotion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promotion'
        '404':
          description: Promotion non trouvée
    put:
      tags: [Promotions]
      summary: Mettre à jour une promotion
      operationId: updatePromotion
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Promotion'
      responses:
        '200':
          description: Promotion mise à jour avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promotion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Promotion non trouvée
    delete:
      tags: [Promotions]
      summary: Supprimer une promotion
      operationId: deletePromotion
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '204':
          description: Promotion supprimée avec succès
        '404':
          description: Promotion non trouvée

  /semesters:
    post:
      tags: [Semesters]
      summary: Créer un semestre
      operationId: createSemester
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Semester'
      responses:
        '201':
          description: Semestre créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Semester'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [Semesters]
      summary: Récupérer tous les semestres
      operationId: getAllSemesters
      responses:
        '200':
          description: Liste de tous les semestres
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Semester'

  /semesters/{id}:
    get:
      tags: [Semesters]
      summary: Récupérer un semestre par son ID
      operationId: getSemesterById
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Détails du semestre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Semester'
        '404':
          description: Semestre non trouvé
    put:
      tags: [Semesters]
      summary: Mettre à jour un semestre
      operationId: updateSemester
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Semester'
      responses:
        '200':
          description: Semestre mis à jour avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Semester'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Semestre non trouvé
    delete:
      tags: [Semesters]
      summary: Supprimer un semestre
      operationId: deleteSemester
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '204':
          description: Semestre supprimé avec succès
        '404':
          description: Semestre non trouvé

  /groups:
    post:
      tags: [Groups]
      summary: Créer un groupe
      operationId: createGroup
      parameters:
        - name: promotionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: ID de la promotion à laquelle le groupe appartient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Group'
      responses:
        '201':
          description: Groupe créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [Groups]
      summary: Récupérer tous les groupes
      operationId: getAllGroups
      responses:
        '200':
          description: Liste de tous les groupes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'

  /groups/{id}:
    get:
      tags: [Groups]
      summary: Récupérer un groupe par son ID
      operationId: getGroupById
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Détails du groupe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          description: Groupe non trouvé
    put:
      tags: [Groups]
      summary: Mettre à jour un groupe
      operationId: updateGroup
      parameters:
        - $ref: '#/components/parameters/UuidPath'
        - name: promotionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: ID de la nouvelle promotion pour le groupe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Group'
      responses:
        '200':
          description: Groupe mis à jour avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Groupe non trouvé
    delete:
      tags: [Groups]
      summary: Supprimer un groupe
      operationId: deleteGroup
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '204':
          description: Groupe supprimé avec succès
        '404':
          description: Groupe non trouvé

  /exams:
    post:
      tags: [Exams]
      summary: Créer un examen
      operationId: createExam
      parameters:
        - name: courseId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: ID du cours associé à l'examen
        - name: semesterId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: ID du semestre de l'examen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Exam'
      responses:
        '201':
          description: Examen créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exam'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [Exams]
      summary: Récupérer tous les examens
      operationId: getAllExams
      responses:
        '200':
          description: Liste de tous les examens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Exam'

  /exams/{id}:
    get:
      tags: [Exams]
      summary: Récupérer un examen par son ID
      operationId: getExamById
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Détails de l'examen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exam'
        '404':
          description: Examen non trouvé
    put:
      tags: [Exams]
      summary: Mettre à jour un examen
      operationId: updateExam
      parameters:
        - $ref: '#/components/parameters/UuidPath'
        - name: courseId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: ID du nouveau cours pour l'examen
        - name: semesterId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: ID du nouveau semestre pour l'examen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Exam'
      responses:
        '200':
          description: Examen mis à jour avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exam'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Examen non trouvé
    delete:
      tags: [Exams]
      summary: Supprimer un examen
      operationId: deleteExam
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '204':
          description: Examen supprimé avec succès
        '404':
          description: Examen non trouvé

  /notes:
    post:
      tags: [Notes]
      summary: Créer une note
      operationId: createNote
      security:
        - bearerAuth: []
      parameters:
        - name: examId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: ID de l'examen lié à la note
        - name: studentId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: ID de l'étudiant qui a reçu la note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Note'
      responses:
        '201':
          description: Note créée avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Non authentifié
    get:
      tags: [Notes]
      summary: Récupérer toutes les notes (selon les droits de l'utilisateur)
      operationId: getAllNotes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des notes accessibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
        '401':
          description: Non authentifié

  /notes/{id}:
    get:
      tags: [Notes]
      summary: Récupérer une note par son ID
      operationId: getNoteById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Détails de la note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '401':
          description: Non authentifié
        '404':
          description: Note non trouvée ou accès non autorisé
    put:
      tags: [Notes]
      summary: Mettre à jour une note
      operationId: updateNote
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UuidPath'
        - name: examId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: ID du nouvel examen pour la note
        - name: studentId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: ID du nouvel étudiant pour la note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Note'
      responses:
        '200':
          description: Note mise à jour avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Non authentifié
        '404':
          description: Note non trouvée ou accès non autorisé
    delete:
      tags: [Notes]
      summary: Supprimer une note
      operationId: deleteNote
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '204':
          description: Note supprimée avec succès
        '401':
          description: Non authentifié
        '404':
          description: Note non trouvée ou accès non autorisé

  /note-histories:
    post:
      tags: [Note Histories]
      summary: Créer un enregistrement d'historique pour une note
      operationId: createNoteHistory
      security:
        - bearerAuth: []
      parameters:
        - name: noteId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: ID de la note dont on enregistre l'historique
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteHistory'
      responses:
        '201':
          description: Historique créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Non authentifié
    get:
      tags: [Note Histories]
      summary: Récupérer tous les historiques de notes
      operationId: getAllNoteHistories
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des historiques accessibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NoteHistory'
        '401':
          description: Non authentifié

  /note-histories/{id}:
    get:
      tags: [Note Histories]
      summary: Récupérer un historique par son ID
      operationId: getNoteHistoryById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Détails de l'historique
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteHistory'
        '401':
