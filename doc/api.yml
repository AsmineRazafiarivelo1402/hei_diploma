components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UuidPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier in UUID format

  schemas:
    CreateUserRequest:
      type: object
      required:
        - reference
        - firstName
        - lastName
        - birthdate
        - email
        - rawPassword
      properties:
        reference:
          type: string
          description: Functional reference of the user
          example: "STU-2026-0001"
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Doe"
        birthdate:
          type: string
          format: date-time
          example: "2001-05-14T00:00:00Z"
        email:
          type: string
          format: email
          example: "john.doe@hei.mg"
        rawPassword:
          type: string
          format: password
          minLength: 8
          description: Plain-text password provided by the client
          example: "S3curePassword!"
        address:
          type: string
          example: "123 Main Street, Antananarivo"
        phoneNumber:
          type: string
          example: "+261340000000"

    CreateAdminRequest:
      type: object
      required:
        - reference
        - firstName
        - lastName
        - birthdate
        - email
        - password
      properties:
        reference:
          type: string
          example: "ADM-2026-0001"
        firstName:
          type: string
          example: "Admin"
        lastName:
          type: string
          example: "User"
        birthdate:
          type: string
          format: date-time
          example: "1980-01-01T00:00:00Z"
        email:
          type: string
          format: email
          example: "admin@hei.mg"
        password:
          type: string
          format: password
          minLength: 8
          example: "AdminSecure123!"
        address:
          type: string
          example: "456 Admin Street"
        phoneNumber:
          type: string
          example: "+261330000000"

    UserResponse:
      type: object
      properties:
        reference:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        birthdate:
          type: string
          format: date-time
        email:
          type: string
        address:
          type: string
        phoneNumber:
          type: string
        role:
          type: string
          enum: [STUDENT, TEACHER, ADMIN]
      description: The password is never returned in the response

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 400
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "Field 'email' is required."
        path:
          type: string
          example: "/api/students"

    Student:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the student
        reference:
          type: string
          description: Functional reference
        firstName:
          type: string
        lastName:
          type: string
        birthdate:
          type: string
          format: date-time
        email:
          type: string
          format: email
        address:
          type: string
        phoneNumber:
          type: string
        userId:
          type: string
          format: uuid
          description: ID of the associated user

    Teacher:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        birthdate:
          type: string
          format: date-time
        email:
          type: string
          format: email
        address:
          type: string
        phoneNumber:
          type: string
        userId:
          type: string
          format: uuid

    Course:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: "CS101"
        name:
          type: string
          example: "Introduction to Computer Science"
        credits:
          type: integer
          example: 3
        description:
          type: string

    Promotion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Promotion 2026"
        year:
          type: integer
          example: 2026
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    Semester:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Semester 1"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        promotionId:
          type: string
          format: uuid

    Group:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Group A"
        promotionId:
          type: string
          format: uuid

    Exam:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Final Exam"
        coefficient:
          type: number
          format: float
          example: 1.5
        date:
          type: string
          format: date-time
        duration:
          type: integer
          description: Duration in minutes
          example: 120
        courseId:
          type: string
          format: uuid
        semesterId:
          type: string
          format: uuid

    Note:
      type: object
      properties:
        id:
          type: string
          format: uuid
        value:
          type: number
          format: float
          minimum: 0
          maximum: 20
          example: 15.5
        examId:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    NoteHistory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        noteId:
          type: string
          format: uuid
        oldValue:
          type: number
          format: float
        newValue:
          type: number
          format: float
        modifiedBy:
          type: string
          format: uuid
          description: ID of the user who made the modification
        modifiedAt:
          type: string
          format: date-time

    Teaching:
      type: object
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        teacherId:
          type: string
          format: uuid

    CourseSpeciality:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "AI Speciality"
        description:
          type: string
        coursesId:
          type: string
          format: uuid
        semesterId:
          type: string
          format: uuid

    Affectation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        semesterId:
          type: string
          format: uuid

    GroupExam:
      type: object
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        examId:
          type: string
          format: uuid

  responses:
    BadRequest:
      description: Invalid request (missing or malformed field)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: A user with this reference or email already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'