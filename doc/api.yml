    get:
      tags: [Notes]
      summary: Retrieve all grades (based on user permissions)
      operationId: getAllNotes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of accessible grades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
        '401':
          description: Not authenticated

  /notes/{id}:
    get:
      tags: [Notes]
