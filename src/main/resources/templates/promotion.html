<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Promotions - HEI Diploma</title>
</head>
<body>

<h1>Liste des promotions</h1>

<table border="1" cellpadding="8">
    <thead>
    <tr>
        <th>Promotion</th>
        <th>Nombre de groupes</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="promotion : ${promotions}">
        <td th:text="${promotion.startYear} + ' - ' + ${promotion.endYear}">2023 - 2026</td>
        <td th:text="${promotion.groupList.size()}">0</td>
        <td>
            <a sec:authorize="hasRole('ADMIN')"
               th:href="@{/diplomas/view(promotionId=${promotion.id})}">
                Voir les diplômés
            </a>
            <span sec:authorize="!hasRole('ADMIN')">-</span>
        </td>
    </tr>
    </tbody>
</table>

<p th:if="${promotions.isEmpty()}">Aucune promotion enregistrée.</p>

</body>
</html>
