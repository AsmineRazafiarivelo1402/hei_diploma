<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Diplômés - HEI Diploma</title>
</head>
<body>

<h1>Liste des diplômés</h1>

<a th:href="@{/diplomas(promotionId=${promotionId})}">Télécharger en Excel</a>

<table border="1" cellpadding="8">
    <thead>
    <tr>
        <th>Rang</th>
        <th>Nom</th>
        <th>Prénom</th>
        <th>Moyenne</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="ranking : ${rankedGraduates}">
        <td th:text="${ranking.rank()}">1</td>
        <td th:text="${ranking.student().lastName}">Nom</td>
        <td th:text="${ranking.student().firstName}">Prénom</td>
        <td th:text="${ranking.average()}">15.5</td>
    </tr>
    </tbody>
</table>

<p th:if="${rankedGraduates.isEmpty()}">Aucun diplômé pour cette promotion.</p>

<a href="/promotions/view">Retour aux promotions</a>

</body>
</html>
